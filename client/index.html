<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>OctaTrade — Paper trading terminal for Indian equities</title>
    <meta
      name="description"
      content="OctaTrade is a paper-trading terminal. Place simulated orders against live quotes with virtual funds, and study order lifecycle, wallet settlement and portfolio allocation without risking capital."
    />
    <link rel="icon" href="/octatrade-mark.svg" type="image/svg+xml" />

    <!-- Preloaded so the webfonts are ready at first paint and text never
         swaps visibly. Both are small Latin-subset variable files. -->
    <link
      rel="preload"
      href="/fonts/inter-tight-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
